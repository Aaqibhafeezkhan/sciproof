name: 'SciProof Verification'
description: 'Verify computational experiment reproducibility manifests and report SARIF/JUnit alerts'
author: 'HayagrivAI Labs'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  manifest:
    description: 'Path to .sciproof.json manifest file or directory to check'
    required: false
    default: '.'
  rerun:
    description: 'Execute the recorded command again in sandbox to verify outputs'
    required: false
    default: 'false'
  format:
    description: 'Output format (text, json, markdown, junit, sarif, html)'
    required: false
    default: 'sarif'
  sarif-file:
    description: 'File path to write SARIF output'
    required: false
    default: 'sciproof.sarif'
  strict-env:
    description: 'Fail if execution environment differs during rerun'
    required: false
    default: 'false'
  policy:
    description: 'Optional path to policy TOML file to enforce rules'
    required: false
    default: ''

outputs:
  verdict:
    description: 'Final verification verdict (PASS, FAIL, INCONCLUSIVE)'
    value: ${{ steps.verify.outputs.verdict }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '>=3.11'

    - name: Install SciProof
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Run SciProof Verification
      id: verify
      shell: bash
      run: |
        FLAGS=""
        if [ "${{ inputs.rerun }}" = "true" ]; then
          FLAGS="$FLAGS --rerun --yes"
        fi
        if [ "${{ inputs.strict-env }}" = "true" ]; then
          FLAGS="$FLAGS --strict-env"
        fi
        if [ -n "${{ inputs.policy }}" ]; then
          FLAGS="$FLAGS --policy ${{ inputs.policy }}"
        fi

        if [[ -f "${{ inputs.manifest }}" ]]; then
          echo "Verifying manifest: ${{ inputs.manifest }}"
          python -m sciproof verify "${{ inputs.manifest }}" --format ${{ inputs.format }} $FLAGS > "${{ inputs.sarif-file }}" || EXIT_CODE=$?
          echo "verdict=$(python -m sciproof verify "${{ inputs.manifest }}" --quiet $FLAGS || true)" >> "$GITHUB_OUTPUT"
          exit ${EXIT_CODE:-0}
        else
          echo "Checking all manifests in directory: ${{ inputs.manifest }}"
          python -m sciproof list "${{ inputs.manifest }}" --check
        fi
